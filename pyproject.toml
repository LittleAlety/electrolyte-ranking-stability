# Why this file exists
# --------------------
# The Week-1 toolchain has to be installable and testable on a laptop that has
# no xtb/CREST/ORCA installed, so the package is deliberately dependency-light:
# the runtime surface under ``src/electrolyte_ranking`` only needs the standard
# library, which keeps ``pip install -e .`` (and the test suite) green in a bare
# environment. Heavier scientific stacks (numpy/scipy/pandas/rdkit) live in the
# ``science`` extra and are pulled in by the analysis stages, not by the toolchain.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "electrolyte-ranking"
version = "0.1.0"
description = "Toolchain for the electrolyte-solvent ranking-stability project (xTB / ORCA drivers, provenance, environment probe)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
science = ["numpy>=1.23"]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/electrolyte_ranking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
